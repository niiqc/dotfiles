# Status bar ----------------------------------

# # Status - Performance 
set-option -g history-limit 10000

set -g automatic-rename off
set -g allow-rename off

set -g renumber-windows on

# # Status - Ui
set -g status on
set -g status-position top
set -g status-style bg=default,fg=white

set -g status-interval 10
set -g status-justify centre

set -g status-left-length 40
set -g status-left "#[fg=red][ #S ]#[default]"

set -g status-right-length 60
set -g status-right "#[fg=green][ #[fg=cyan]%Y-%m-%d #[fg=white]%H:%M #[fg=green]]"

set -g window-status-separator " "

set -g window-status-format "#[fg=white]#I:#{pane_current_command}"
set -g window-status-current-format "#[fg=green](*#[fg=white]#I:#{pane_current_command}#[fg=green])"

# this options needs renaming on high use of cpu
# set -g window-status-format "#[fg=white]#I:#W"
# set -g window-status-current-format "#[fg=green](*#[fg=white]#I:#W#[fg=green])"
#
# losing rename function but 0 delay - this options gets title from terminal
# set -g window-status-format "#[fg=white]#I:#{?pane_title,#{pane_title},#{pane_current_command}}"
# set -g window-status-current-format "#[fg=green](*#[fg=white]#I:#{?pane_title,#{pane_title},#{pane_current_command}}#[fg=green])"

# Other ui features ----------------------------------
set -g mouse on

set -g monitor-activity off
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
set -g bell-action none

